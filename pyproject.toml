[build-system]
# pin max versions of build deps and update as needed
# setuptools 77.0.3 introduces PEP 639 support, used here
requires = ["setuptools>=77.0.3, <=80.9.0", "setuptools-scm[toml]>=6.2, <=9.2.0"]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.10"
name = "ansible-runner"
dynamic = ["version"]
authors = [
    {name = "Ansible Project"},
]
description = "Consistent Ansible Python API and CLI with container and process isolation runtime capabilities"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "pexpect>=4.5",
    "packaging",
    "python-daemon",
    "pyyaml",
]

[project.urls]
source = "https://github.com/ansible/ansible-runner"
issues = "https://github.com/ansible/ansible-runner/issues"
documentation = "https://ansible-runner.readthedocs.io"

[project.scripts]
ansible-runner = "ansible_runner.__main__:main"

[tool.setuptools_scm]

[[tool.mypy.overrides]]
module = [
    "ansible.*",
    "daemon.*",
    "pexpect",
]
ignore_missing_imports = true

[tool.pylint.main]
output-format = "colorized"
disable = [
  # Some codes we will leave disabled
  "C0103",  # invalid-name
  "C0114",  # missing-module-docstring
  "C0115",  # missing-class-docstring
  "C0116",  # missing-function-docstring
  "C0301",  # line-too-long
  "R0401",  # cyclic-import
  "R0801",  # duplicate-code
  "R0902",  # too-many-instance-attributes
  "R0903",  # too-few-public-methods
  "R0904",  # too-many-public-methods
  "R0911",  # too-many-return-statements
  "R0912",  # too-many-branches
  "R0913",  # too-many-arguments
  "R0914",  # too-many-locals
  "R0915",  # too-many-statements
  "R0917",  # too-many-positional-arguments
  "W0221",  # arguments-differ
  "W0511",  # fixme
  "W0603",  # global-statement
  "W0718",  # broad-exception-caught
  "W0719",  # broad-exception-raised
  "W1514",  # unspecified-encoding
]
